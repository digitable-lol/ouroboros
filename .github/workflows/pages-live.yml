# The guard on the live site.
#
# Why. GitHub builds the pages itself, and when that build fails nobody finds
# out: the site goes on serving the previous successful snapshot. That is exactly
# what happened on 29 August — `docs/_config.yml` stopped parsing as YAML, the
# build failed for a full day, and all that time the site promised five languages
# while the tree had six, release 0.3.0 while there was 0.4.0, and answered 404 on
# `measurements.html`, a page from its own table of contents. It was noticed by
# accident.
#
# What is checked here is not the build but the site itself over HTTP, and by two
# different questions:
#
# * `scripts/check_pages_live.py` — does what is served match the tree: every
#   documentation page at its own address, `state.json`, and the numbers in the
#   marks on the live documentation page;
# * `site/check-live.py` — is this our site at all: is the landing page at the
#   root (by a sentence that appears on no documentation page), is the
#   documentation under `docs/`, do its former addresses answer, is every diagram
#   in place. That question exists because the first one does not answer it:
#   while two publishers share one root, every address can be in place and the
#   site still not be ours.
#
# A refusal means exactly one thing — what is visible from outside is not what is
# in the branch. Until the Pages source is switched to GitHub Actions (Settings ->
# Pages, the order is in `site/README.md`), the second guard will be red: the root
# serves the documentation built by Jekyll, and there is no landing page on the
# site. That is a correct reading, not a breakage.

name: the live site matches the tree

on:
  # After a push to the branch — with a wait: the build takes several minutes,
  # and until it ends the site rightly serves the previous snapshot.
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - ".github/workflows/pages-live.yml"
      - "scripts/check_pages_live.py"
  # Once a day — so that falling behind is found without a new push as well: the
  # deployment itself could have broken with the tree untouched. And so that the
  # question "what is on the site now" is asked at other times than the minute
  # after our own deployment: while two publishers share the root, the answer a
  # minute later and the answer an hour later are different answers.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A guard that has never gone red means nothing: this one breaks the site
      # in its own sandbox eight ways and demands that each one be noticed.
      - name: "the live-site guard: self-test"
        run: python3 site/check-live.py --self-test

      # The check gets by on the standard library: no uv, no dependencies.
      - name: ask the live site about the tree
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Wait up to 10 minutes: that is how long the build on GitHub's side can take.
            python scripts/check_pages_live.py --retries 20 --wait 30
          else
            python scripts/check_pages_live.py
          fi

      # Always, even if the previous step refused: the two questions are
      # different, and both answers are worth knowing, not just the first.
      - name: ask the live site about the landing, the documentation and the diagrams
        if: always()
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python3 site/check-live.py --retries 20 --wait 30
          else
            python3 site/check-live.py
          fi
