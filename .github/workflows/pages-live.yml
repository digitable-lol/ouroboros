# Сторож живого сайта.
#
# Зачем. Сборку страниц GitHub делает сам, и когда она падает, об этом не узнаёт
# никто: сайт продолжает отдавать предыдущий успешный слепок. 29 августа так и
# вышло — `docs/_config.yml` перестал разбираться как YAML, сборка падала сутки,
# а сайт всё это время обещал пять языков при шести в дереве, выпуск 0.3.0 при
# 0.4.0 и отвечал 404 на `measurements.html`, страницу из собственного оглавления.
# Заметили случайно.
#
# Здесь проверяется не сборка, а сам сайт по HTTP: `scripts/check_pages_live.py`
# спрашивает каждую страницу и сверяет числа с деревом. Отказ означает ровно
# одно — снаружи видно не то, что лежит в ветке.

name: живой сайт совпадает с деревом

on:
  # После отправки в ветку — с ожиданием: сборка идёт несколько минут, и до её
  # конца сайт по праву отдаёт прежнее.
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages-live.yml"
      - "scripts/check_pages_live.py"
  # Раз в сутки — чтобы отставание нашлось и без новых отправок: сломаться могла
  # и сама выкладка, при нетронутом дереве.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Проверка обходится стандартной библиотекой: ни uv, ни зависимостей.
      - name: спросить живой сайт
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Ждём до 10 минут: столько может занять сборка на стороне GitHub.
            python scripts/check_pages_live.py --retries 20 --wait 30
          else
            python scripts/check_pages_live.py
          fi
