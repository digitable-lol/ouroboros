# Сторож живого сайта.
#
# Зачем. Сборку страниц GitHub делает сам, и когда она падает, об этом не узнаёт
# никто: сайт продолжает отдавать предыдущий успешный слепок. 29 августа так и
# вышло — `docs/_config.yml` перестал разбираться как YAML, сборка падала сутки,
# а сайт всё это время обещал пять языков при шести в дереве, выпуск 0.3.0 при
# 0.4.0 и отвечал 404 на `measurements.html`, страницу из собственного оглавления.
# Заметили случайно.
#
# Здесь проверяется не сборка, а сам сайт по HTTP, и двумя разными вопросами:
#
# * `scripts/check_pages_live.py` — совпадает ли то, что отдаётся, с деревом:
#   каждая страница документации по своему адресу, `state.json` и числа в
#   пометках на живой странице документации;
# * `site/check-live.py` — тот ли это сайт вообще: лендинг ли в корне (по
#   строке, которой нет ни на одной странице документации), лежит ли
#   документация под `docs/`, отвечают ли прежние её адреса и на месте ли каждая
#   схема. Этот вопрос появился потому, что первый на него не отвечает: пока на
#   один корень публикуют двое, все адреса могут быть на месте, а сайт при этом
#   быть не нашим.
#
# Отказ означает ровно одно — снаружи видно не то, что лежит в ветке. Пока
# источник Pages не переведён на GitHub Actions (Settings → Pages, порядок в
# `site/README.md`), второй сторож будет красным: корень отдаёт документацию,
# собранную Jekyll, а лендинга на сайте нет. Это верное показание, а не поломка.

name: живой сайт совпадает с деревом

on:
  # После отправки в ветку — с ожиданием: сборка идёт несколько минут, и до её
  # конца сайт по праву отдаёт прежнее.
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - ".github/workflows/pages-live.yml"
      - "scripts/check_pages_live.py"
  # Раз в сутки — чтобы отставание нашлось и без новых отправок: сломаться могла
  # и сама выкладка, при нетронутом дереве. И чтобы вопрос «а что на сайте
  # сейчас» задавался не только в минуту после нашей же выкладки: пока корень
  # делят двое, ответ через минуту и ответ через час — разные ответы.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Сторож, который никогда не краснел, ничего не значит: он ломает сайт у
      # себя в песочнице восемью способами и требует, чтобы каждый был замечен.
      - name: "сторож живого сайта: самопроверка"
        run: python3 site/check-live.py --self-test

      # Проверка обходится стандартной библиотекой: ни uv, ни зависимостей.
      - name: спросить живой сайт про дерево
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Ждём до 10 минут: столько может занять сборка на стороне GitHub.
            python scripts/check_pages_live.py --retries 20 --wait 30
          else
            python scripts/check_pages_live.py
          fi

      # Всегда, даже если предыдущий шаг отказал: два вопроса разные, и знать
      # хочется ответы на оба, а не на первый.
      - name: спросить живой сайт про лендинг, документацию и схемы
        if: always()
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python3 site/check-live.py --retries 20 --wait 30
          else
            python3 site/check-live.py
          fi
