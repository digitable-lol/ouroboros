# The guard on what is published: does a person install what is in the tree.
#
# Why. A person does not install the tool from this tree. `brew` takes the
# formula from SOMEBODY ELSE'S repository, `digitable-lol/homebrew-tap`; `asdf`
# takes the archive off a tag. An edit under `packaging/` DOES NOT REACH a person
# until the copy is published, and nobody reports that: the formula `brew` looks
# at is sound — it is simply old.
#
# In the neighbouring flang that is what happened: the tap fell behind releases
# 0.7.4-0.7.9, and all that time `brew install` silently installed 0.7.3. It was
# noticed by a person, not by a check.
#
# What is asked here is the published thing — the archive at the address in the
# formula, the formula itself from the tap, and the repository's tags. A refusal
# means exactly one thing: what installs from outside is not what is in the branch.

name: the published thing matches the release

on:
  # After a push to the branch: an edit to the packaging has to be CARRIED to the
  # tap, and the reminder should come from a machine, not from memory.
  push:
    branches: [main]
    paths:
      - "packaging/**"
      - "pyproject.toml"
      - "ouroboros/__init__.py"
      - ".github/workflows/packaging-live.yml"
      - "scripts/check_release_published.py"
  # Once a day — so that falling behind is found without a new push as well: a tag
  # could have been deleted, an archive re-uploaded, the tap fixed by somebody
  # else's hand, all with the tree untouched.
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published:
    runs-on: ubuntu-latest
    steps:
      # The whole history is needed: the rule "the checksum is not somebody
      # else's" looks at which sha256 the formula declared in past releases. With
      # fetch-depth: 1 there is no evidence, and the rule would fall silent
      # without saying so.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The check gets by on the standard library: no uv, no dependencies.
      # First the check of the check: a rule that catches nothing looks exactly
      # like a rule that everything passed.
      - name: the rules do work
        run: python scripts/check_release_published.py --self-test

      - name: ask the published thing
        env:
          # The formula is fetched through the GitHub API rather than from
          # raw.githubusercontent: that one serves a cache for up to five minutes
          # and, right after a push, would lie in both directions. The API has a
          # rate limit, so the run's own token is used here.
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_release_published.py
