# Сторож выложенного: то ли ставит человек, что лежит в дереве.
#
# Зачем. Человек ставит инструмент не из дерева. `brew` берёт формулу из ЧУЖОГО
# хранилища `digitable-lol/homebrew-tap`, `asdf` — архив с тега. Правка в
# `packaging/` до человека НЕ ДОХОДИТ, пока копию не выложили, и никто об этом не
# сообщает: формула, на которую смотрит `brew`, исправна — она просто старая.
#
# У соседнего flang так и вышло: кран отстал от выпусков 0.7.4—0.7.9, и всё это
# время `brew install` молча ставил 0.7.3. Заметили не проверкой, а человеком.
#
# Здесь спрашивается выложенное — архив по адресу из формулы, сама формула из крана
# и теги хранилища. Отказ означает ровно одно: снаружи ставится не то, что в ветке.

name: выложенное совпадает с выпуском

on:
  # После отправки в ветку: правку в упаковке надо ДОНЕСТИ до крана, и напомнить
  # об этом должна машина, а не память.
  push:
    branches: [main]
    paths:
      - "packaging/**"
      - "pyproject.toml"
      - "ouroboros/__init__.py"
      - ".github/workflows/packaging-live.yml"
      - "scripts/check_release_published.py"
  # Раз в сутки — чтобы отставание нашлось и без новых отправок: тег могли удалить,
  # архив перевыложить, а кран поправить чужой рукой, при нетронутом дереве.
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published:
    runs-on: ubuntu-latest
    steps:
      # Нужна вся история: правило «отпечаток не чужой» смотрит, каким sha256
      # объявлялась формула в прошлых выпусках. При fetch-depth: 1 улики нет, и
      # правило замолчало бы, не сказав об этом.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Проверка обходится стандартной библиотекой: ни uv, ни зависимостей.
      # Сначала — проверка самой проверки: правило, которое ничего не ловит,
      # выглядит точно так же, как правило, которое всё прошло.
      - name: правила работают
        run: python scripts/check_release_published.py --self-test

      - name: спросить выложенное
        env:
          # Формула берётся через API GitHub, а не с raw.githubusercontent: тот
          # отдаёт кэш до пяти минут и сразу после отправки врал бы в обе стороны.
          # У API есть предел частоты, поэтому здесь ходим с ключом прогона.
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_release_published.py
