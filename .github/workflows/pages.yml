# Publishing the site on GitHub Pages: the landing (site/) and the documentation (docs/).
#
# WHAT IS BUILT. `site/build.py` makes the whole site in one go: the landing into
# the root, the documentation into the `docs/` subdirectory, and a redirect at
# every former documentation address pointing at its new place. The documentation
# has 30 addresses. Two of them, `index.html` and `limits.html`, are page names
# the landing uses as well; the root exists in order to serve the landing, so
# those two go to it, and the documentation is one click away — "Documentation"
# in the header. The other 28 answer with a redirect to `docs/…`. Not one is lost.
#
# ⚠ FOR THIS TO APPEAR OUTSIDE, ONE ACTION BY HAND IS NEEDED, and the owner is the
# one who does it: Settings -> Pages -> Build and deployment -> Source: **GitHub
# Actions**. The whole order, with the "nothing was lost" check, is in
# `site/README.md`.
#
# WHY IT DOES NOT WORK WITHOUT THAT. While the source is "Deploy from a branch"
# (branch `main`, directory `/docs`), two publishers write to the same root: the
# built-in Jekyll from `docs/` and this job from `site/out`. Both report success,
# and the root goes to whoever deployed last. Right now that is Jekyll: at
# https://digitable-lol.github.io/ouroboros/ what is served is `docs/index.md`,
# and the landing page is not on the site at all.
#
# UNTIL IT IS SWITCHED, the `live` job below is RED — and that is a reading, not a
# breakage: it says the root serves something other than the landing, which is
# true. The previous check in this same place was green because it asked the site
# right after its own deployment, before Jekyll overwrote it; a green check with
# no landing page on the site is the worst possible reading, and it is gone.
# At the minute of the switch the job goes green on its own, with no edit to the tree.
#
# The build needs nothing but python3: site/build.py has no dependencies at all,
# and the diagrams are drawn in advance and kept in the tree as SVG. No npm, no
# Ruby, no network. It also takes Jekyll out of the site build, together with the
# `_config.yml` whose parsing stopped the whole site for a day on 29 August.

name: The site on Pages

on:
  push:
    branches: [main]
    # Everything the site is built from. The documentation is now part of the
    # site, so editing it calls for a rebuild too; the numbers in the footer and
    # on the pages come from pyproject.toml, LICENSE and docs/state.json.
    paths:
      - "site/**"
      - "docs/**"
      - "pyproject.toml"
      - "LICENSE"
      - "scripts/check_doc_anchors.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Publish one at a time and do not cancel a run in flight: a half-built site is
# worse than a site a minute older.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A separate step before the build: if a link leads nowhere, a snapshot of
      # output was never taken, or a diagram was edited after it was rendered,
      # that shows in the step's name rather than somewhere inside the build
      # output. It refuses; it does not warn.
      - name: Check links, captures and the freshness of the diagrams
        run: python3 site/build.py --check

      - name: Build
        run: python3 site/build.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4

  # Done is when it is visible from outside. The deployment on GitHub's side can
  # succeed while the site serves something else: somebody else's root, a lost
  # diagram (diagrams are separate files, and a missing one does not break the
  # page, it leaves a blank space), documentation with half its pages gone. So
  # here the site itself is asked over HTTP: the root by a sentence that appears
  # on no documentation page, the documentation by every one of its pages and
  # every former address, the diagrams by every file.
  live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The self-test first: a guard that has never gone red means nothing. It
      # breaks the site in its own sandbox eight ways and demands that each one
      # be noticed.
      - name: "The live-site guard: self-test"
        run: python3 site/check-live.py --self-test
      - name: Ask the live site
        run: python3 site/check-live.py --retries 10 --wait 30
