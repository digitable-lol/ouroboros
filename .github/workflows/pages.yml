# Публикация сайта на GitHub Pages: лендинг (site/) и документация (docs/).
#
# ЧТО СОБИРАЕТСЯ. `site/build.py` делает весь сайт разом: лендинг — в корень,
# документацию — в подкаталог `docs/`, и по каждому прежнему адресу документации
# кладёт перенаправление на новое место. Адресов у документации 30. Два из них,
# `index.html` и `limits.html`, — имена страниц и у лендинга; корень для того и
# нужен, чтобы отдавать лендинг, поэтому эти два адреса достаются ему, а
# документация с них в одном щелчке — по «Documentation» в шапке. Остальные 28
# отвечают перенаправлением на `docs/…`. Не теряется ни один.
#
# ⚠ ЧТОБЫ ЭТО ПОЯВИЛОСЬ СНАРУЖИ, НУЖНО ОДНО ДЕЙСТВИЕ РУКАМИ, и делает его
# владелец: Settings → Pages → Build and deployment → Source: **GitHub Actions**.
# Порядок целиком, с проверкой «ничего не пропало», — в `site/README.md`.
#
# ПОЧЕМУ БЕЗ ЭТОГО НЕ РАБОТАЕТ. Пока источник — «Deploy from a branch» (ветка
# `main`, каталог `/docs`), на один и тот же корень публикуют двое: встроенный
# Jekyll из `docs/` и эта работа из `site/out`. Обе показывают «успех», а корень
# достаётся тому, кто выложился позже. Сейчас это Jekyll: по адресу
# https://digitable-lol.github.io/ouroboros/ отдаётся `docs/index.md`, а лендинга
# на сайте нет вовсе.
#
# ПОКА НЕ ПЕРЕКЛЮЧЕНО, работа `live` внизу КРАСНАЯ — и это показание, а не
# поломка: она говорит, что корень отдаёт не лендинг, и это правда. Прежняя
# проверка в этом же месте была зелёной, потому что спрашивала сайт сразу после
# своей выкладки, до того как Jekyll её перезапишет; зелёная проверка при
# отсутствующем на сайте лендинге — худшее из возможных показаний, и её больше
# нет. В минуту переключения работа зеленеет сама, без правок в дереве.
#
# Сборке не нужно ничего, кроме python3: у site/build.py зависимостей нет ни
# одной, а схемы нарисованы заранее и лежат в дереве как SVG. Ни npm, ни Ruby,
# ни сети. Заодно из сборки сайта уходит Jekyll со своим `_config.yml`, разбор
# которого 29 августа остановил весь сайт на сутки.

name: Сайт на Pages

on:
  push:
    branches: [main]
    # Всё, из чего сайт собирается. Документация теперь часть сайта, поэтому её
    # правка тоже требует пересборки; числа в подвале и на страницах берутся из
    # pyproject.toml, LICENSE и docs/state.json.
    paths:
      - "site/**"
      - "docs/**"
      - "pyproject.toml"
      - "LICENSE"
      - "scripts/check_doc_anchors.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Публикуем по одной за раз и не обрываем идущую: недособранный сайт хуже, чем
# сайт минутой старее.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Отдельным шагом до сборки: если ссылка ведёт в никуда, снимок вывода не
      # снят или схему правили после отрисовки — видно по имени шага, а не среди
      # вывода сборки. Отказывает, а не предупреждает.
      - name: Проверить ссылки, снимки и свежесть схем
        run: python3 site/build.py --check

      - name: Собрать
        run: python3 site/build.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4

  # Сделано — это когда видно снаружи. Выкладка на стороне GitHub может пройти,
  # а сайт при этом отдавать не то: чужой корень, потерянную схему (схемы —
  # отдельные файлы, и пропавшая не ломает страницу, а оставляет пустое место),
  # документацию без половины страниц. Поэтому здесь спрашивается сам сайт по
  # HTTP: корень — по строке, которой нет ни на одной странице документации,
  # документация — по каждой своей странице и по каждому прежнему адресу, схемы —
  # по каждому файлу.
  live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Сначала самопроверка: сторож, который никогда не краснел, ничего не
      # значит. Он ломает сайт у себя в песочнице восемью способами и требует,
      # чтобы каждый был замечен.
      - name: "Сторож живого сайта: самопроверка"
        run: python3 site/check-live.py --self-test
      - name: Спросить живой сайт
        run: python3 site/check-live.py --retries 10 --wait 30
