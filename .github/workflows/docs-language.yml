# The guard on the language of the documentation.
#
# Why. The rule of the tree is read off the file name: `README.md` is English,
# `README.ru.md` is Russian. The rule is simple, and it comes apart gradually and
# in silence: a Russian paragraph is added to an English page, a Russian
# counterpart is never created, the language switch points at the wrong file.
# Each such edit looks like a trifle on its own and is invisible in review — the
# page has hundreds of lines.
#
# Checked here as well is the Russian description of the tool in flang
# (`docs/ouroboros.flang`): it is not prose but a program, and the compiler
# judges it on its own — types, proven termination of every function, examples
# inside the functions. Locally this step is skipped when the compiler is not on
# the machine; here it always is, so "not checked" is impossible.

name: the language of the documentation

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "docs/**"
      - "scripts/check_doc_language.py"
      - ".github/workflows/docs-language.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "docs/**"
      - "scripts/check_doc_language.py"
      - ".github/workflows/docs-language.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The negative control goes FIRST, deliberately: a check that has never
      # refused is green for free. The self-test feeds the guard broken pages and
      # demands a refusal on each.
      - name: the guard's negative control
        run: python scripts/check_doc_language.py --self-test

      # The check gets by on the standard library: no uv, no dependencies.
      - name: English by default, Russian as a .ru pair
        run: python scripts/check_doc_language.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The version is nailed down. The description is checked against 0.7.3 and
      # against 0.7.10; a floating "latest" would turn somebody else's compiler
      # release into our red guard.
      - name: install the flang compiler
        run: npm i -g @digitable-lol/flang@0.7.3

      - name: the Russian description is checked by the compiler
        run: |
          flang check docs/ouroboros.flang
          flang test docs/ouroboros.flang
