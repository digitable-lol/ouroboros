# Сторож языка документации.
#
# Зачем. Правило дерева читается по имени файла: `README.md` — английский,
# `README.ru.md` — русский. Правило простое, а разъезжается оно постепенно и
# молча: в английскую страницу дописывают русский абзац, русскую пару забывают
# завести, переключатель языка ставят не на тот файл. Каждая такая правка по
# отдельности выглядит мелочью и в обзоре не видна — у страницы сотни строк.
#
# Здесь же проверяется русское описание инструмента на flang
# (`docs/ouroboros.flang`): оно не проза, а программа, и компилятор судит о нём
# сам — типы, доказанное завершение каждой функции, примеры внутри функций.
# Локально этот шаг пропускается, если компилятора нет на машине; тут он есть
# всегда, поэтому «не проверено» здесь невозможно.

name: язык документации

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "docs/**"
      - "scripts/check_doc_language.py"
      - ".github/workflows/docs-language.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "docs/**"
      - "scripts/check_doc_language.py"
      - ".github/workflows/docs-language.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Отрицательный контроль идёт ПЕРВЫМ и намеренно: проверка, которая
      # никогда не отказывала, зелена бесплатно. Самопроверка подсовывает
      # сторожу испорченные страницы и требует, чтобы он на каждой отказал.
      - name: отрицательный контроль сторожа
        run: python scripts/check_doc_language.py --self-test

      # Проверка обходится стандартной библиотекой: ни uv, ни зависимостей.
      - name: английский по умолчанию, русский парой .ru
        run: python scripts/check_doc_language.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Версия прибита гвоздём. Описание проверено на 0.7.3 и на 0.7.10;
      # плавающая «последняя» превратила бы чужой выпуск компилятора в наш
      # красный сторож.
      - name: поставить компилятор flang
        run: npm i -g @digitable-lol/flang@0.7.3

      - name: русское описание проверяется компилятором
        run: |
          flang check docs/ouroboros.flang
          flang test docs/ouroboros.flang
