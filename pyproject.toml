[project]
name = "ouroboros-logger"
version = "0.2.0"
description = "Ouroboros-Logger: guaranteed function-level logging instrumentation for AI-authored code, exposed over MCP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "libclang>=18.1.1",
    "mcp>=1.2.0",
]

[project.scripts]
ouroboros = "ouroboros.cli:main"
ouroboros-mcp = "ouroboros.mcp.server:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ouroboros"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["ouroboros"]

# --------------------------------------------------------------------------- #
# Code-quality gates. STANDING RULE: any edit to MCP code (ouroboros/), however
# minor, must pass `ruff check`, `mypy ouroboros`, and `pytest` before it is
# considered done. The Elixir lesson — "gone-green != warning-free" — applies:
# don't suppress findings (no blanket noqa / type: ignore); fix the real defect.
# scripts/qa.sh runs all three.
# --------------------------------------------------------------------------- #

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle(E/W), pyflakes(F), isort(I), pyupgrade(UP), bugbear(B),
# comprehensions(C4), simplify(SIM), pep8-naming(N).
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "N"]

[tool.ruff.lint.isort]
# keep `from x import (a as b, c as d)` as one block instead of one per name.
combine-as-imports = true

[tool.mypy]
python_version = "3.12"
strict = true
# libclang ships no type stubs — a real third-party-import gap, not a dodge.
[[tool.mypy.overrides]]
module = ["clang.*"]
ignore_missing_imports = true
