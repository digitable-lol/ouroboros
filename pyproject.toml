[project]
name = "ouroboros-logger"
version = "0.5.0"
description = "Ouroboros-Logger: guaranteed function-level logging instrumentation for AI-authored code, exposed over MCP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # The shared object the C/C++ range emitter opens at run time. Nothing
    # imports the Python bindings any more (see ouroboros/languages/
    # clangbridge.py); the dependency stays because it is what guarantees a
    # libclang is on the machine without asking the user to install one.
    "libclang>=18.1.1",
    # Верхняя граница обязательна. В mcp 2.x FastMCP переименован в MCPServer, и
    # `from mcp.server.fastmcp import FastMCP` в ouroboros/mcp/server.py падает с
    # ModuleNotFoundError. Без границы любая свежая установка (pip, uv tool
    # install, Homebrew, asdf) тянет 2.x и получает нерабочий сервер MCP, хотя
    # командная строка при этом работает — то есть ломается молча и не сразу.
    # uv.lock этого не спасает: он действует только для `uv sync`.
    "mcp>=1.2.0,<2",
]

[project.scripts]
ouroboros = "ouroboros.cli:main"
ouroboros-mcp = "ouroboros.mcp.server:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ouroboros"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["ouroboros"]
# Напечатанный компилятором flang мозг (`ouroboros/brain/_flang`) — это ВЫВОД
# компилятора, а не код проекта, ровно как подопытные программы замеров у ruff
# ниже. Его правильность держат 96 примеров, которые компилятор прогоняет внутри
# самих функций (`flang test`), и доказанное завершение каждой из 42 — а не то,
# до какой его ветви добралась питоновская проверка. Считать его покрытие значит
# мерить чужую работу своей линейкой: см. docs/sdd/brain-in-flang.md.
omit = ["ouroboros/brain/_flang/*"]

# --------------------------------------------------------------------------- #
# Code-quality gates. STANDING RULE: any edit to MCP code (ouroboros/), however
# minor, must pass `ruff check`, `mypy ouroboros`, and `pytest` before it is
# considered done. The Elixir lesson — "gone-green != warning-free" — applies:
# don't suppress findings (no blanket noqa / type: ignore); fix the real defect.
# scripts/qa.sh runs all three.
# --------------------------------------------------------------------------- #

[tool.ruff]
line-length = 100
target-version = "py312"
# Подопытные программы замеров — это ВХОДНЫЕ ДАННЫЕ, а не код проекта. Они
# нарочно написаны так, как пишет обычный человек (`try/except/pass`, а не
# `contextlib.suppress`), потому что их текст показан в docs/measurements.md и
# обмазывается как есть. Причёсывать их под правила проекта значило бы мерять не
# то, что читатель у себя запустит.
# Снимки прогонов под site/examples/captured — тоже входные данные, а не код
# проекта: это вывод инструмента, показанный на сайте дословно.
# Напечатанный мозг на flang — тоже вывод компилятора, не исходник проекта:
# правится он в `ouroboros/brain/trace_brain.flang` и печатается заново
# (`scripts/emit_brain.py`), а причёсывать печать под правила проекта значило
# бы править то, что при следующей печати вернётся как было.
extend-exclude = ["scripts/measure/samples", "site/examples/captured",
                  "ouroboros/brain/_flang"]

[tool.ruff.lint]
# pycodestyle(E/W), pyflakes(F), isort(I), pyupgrade(UP), bugbear(B),
# comprehensions(C4), simplify(SIM), pep8-naming(N).
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "N"]

[tool.ruff.lint.isort]
# keep `from x import (a as b, c as d)` as one block instead of one per name.
combine-as-imports = true

[tool.mypy]
python_version = "3.12"
strict = true
# No per-module relaxations. There used to be one for `clang.*` (libclang ships
# no type stubs), needed because the C and C++ backends imported clang.cindex
# and passed untyped cursors around. They no longer import it: libclang is
# spoken to by ouroboros/languages/_clang/emitter.c, on the far side of a
# process boundary, and what crosses back is JSON.
